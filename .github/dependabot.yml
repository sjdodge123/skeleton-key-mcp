# Dependency updates. `cooldown` holds back a freshly published version for a
# few days, so a hijacked release is usually caught and yanked before it can
# land here. Security updates (enabled in repo settings) are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must track the RUNTIME Node major (the Dockerfile and CI
      # pin Node 22). Types for a newer Node let code use APIs that don't exist
      # at runtime. Bump this together with the runtime, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node majors are moved deliberately, LTS to LTS (22 -> 24 -> 26), with
      # CI, @types/node and native modules (better-sqlite3 prebuilds) together.
      # Dependabot would otherwise propose odd, non-LTS majors like 25.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
